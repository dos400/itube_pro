# Builds a signed release APK and publishes it as GitHub release v<versionCode>.
# The app's updater (ui/update) reads the latest release and installs its APK.
#
# Runs on every push to main, by hand (Actions tab → Run workflow), and from
# extractor-bump.yml (pushes made with GITHUB_TOKEN don't trigger workflows, so that
# workflow calls this one itself).
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: write

# One release at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history: versionCode is the commit count (app/build.gradle.kts).
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The phone's app is signed with the Mac's ~/.android/debug.keystore. Android only
      # accepts an update signed with the same key, so CI must use that exact file.
      # Without the secret, AGP would silently create a new key and the update would fail
      # on the phone, so stop here instead.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:'

      - name: Unit tests
        run: ./gradlew :domain:test testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease -PupdateRepo=${{ github.repository }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          TAG="v$CODE"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          APK="itubepro-$CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$(git rev-parse HEAD)" \
            --title "itube pro 1.$CODE" \
            --notes "$(git log -1 --format=%s)"
