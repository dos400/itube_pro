# Builds a signed release APK and publishes it as GitHub release v<versionCode>.
# The app's updater (ui/update) reads the latest release and installs its APK.
#
# Runs on every push to main, by hand (Actions tab → Run workflow), and from
# extractor-bump.yml (pushes made with GITHUB_TOKEN don't trigger workflows, so that
# workflow calls this one itself).
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: write

# One release at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history: versionCode is the commit count (app/build.gradle.kts).
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already has the Android SDK; AGP downloads missing platforms
      # itself once the licenses are accepted. (android-actions/setup-android@v3 broke:
      # it installs the removed 'tools' package.)
      - name: Accept Android SDK licenses
        run: (yes || true) | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # The phone's app is signed with the Mac's ~/.android/debug.keystore. Android only
      # accepts an update signed with the same key, so CI must use that exact file.
      # app/build.gradle.kts reads it from SIGNING_KEYSTORE (an explicit path: AGP's implicit
      # debug keystore was ignored here and v16/v17 got a random key).
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/signing.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :domain:test testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease -PupdateRepo=${{ github.repository }}

      # Never publish an APK the phone would reject. The expected value is the certificate
      # of the installed app (`apksigner verify --print-certs`), not a secret.
      - name: Check the APK's signing certificate
        env:
          EXPECTED_CERT_SHA256: 9d8c13a90f893943b6eae783e1e17b09aafd3d378fab2f6e8df92a2450e33f03
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "APK certificate: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with the wrong key ($ACTUAL); the phone would refuse the update."
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          TAG="v$CODE"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          APK="itubepro-$CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --target "$(git rev-parse HEAD)" \
            --title "itube pro 1.$CODE" \
            --notes "$(git log -1 --format=%s)"
